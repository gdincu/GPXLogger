<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced GPX Tracker</title>
	<link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
	<link rel="icon" type="image/png" href="icon-192.png">
</head>
<body>

    <h2>Advanced GPX Logger</h2>
    
    <div class="presets">
        <button id="btn-walk">🚶 Walk</button>
        <button id="btn-bike">🚴 Bike</button>
        <button id="btn-drive">🚗 Drive</button>
    </div>
    
    <div class="settings-panel">
        <label title="Ignore points with an error margin larger than this.">Max Accuracy Error (meters):</label>
        <input type="number" id="set-accuracy" value="30">

        <label title="Only log if you move at least this far.">Minimum Distance (meters):</label>
        <input type="number" id="set-distance" value="5">

        <label title="Force a log if this much time passes while moving, even if distance isn't met.">Max Time Between Logs (seconds):</label>
        <input type="number" id="set-time" value="60">

        <label title="Ignore points that require moving faster than this.">Max Speed Sanity Check (km/h):</label>
		<input type="number" id="set-speed" value="100">
    </div>

    <div id="status">Status: Idle</div>
    <div id="accuracy"></div>
    
    <button id="lockGpsBtn">📡 Lock GPS Signal</button>

	<div class="controls">
		<button id="startBtn">Start Tracking</button>
		<button id="pauseBtn" disabled>Pause Tracking</button>
		<button id="stopBtn" disabled>Stop & Download</button>
	</div>

    <script src="js/script.js" defer></script>
	
	<button id="lockScreenBtn" style="
        position: fixed; 
        bottom: 20px; 
        left: 50%; 
        transform: translateX(-50%); 
        width: 90%; 
        max-width: 400px; 
        padding: 15px; 
        border: none; 
        border-radius: 8px; 
        font-weight: bold; 
        font-size: 16px; 
        cursor: pointer; 
        background-color: #ff9800; 
        color: white; 
        z-index: 1000; 
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
        Lock Screen
    </button>
	
	<div id="touchLockOverlay" class="touch-lock-overlay">
        <div style="font-size: 14px; color: #aaa;">Screen Locked</div>
        
        <!-- Unlock Slider -->
        <input type="range" id="unlockSlider" min="0" max="100" value="0" class="unlock-slider">
        <div style="font-size: 12px; color: #ccc;">Slide right to unlock</div>
    </div>
</body>
</html>
