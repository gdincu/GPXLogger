<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced GPX Tracker</title>
	<link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <h2>Advanced GPX Logger</h2>
    
    <div class="settings-panel">
        <label title="Ignore points with an error margin larger than this.">Max Accuracy Error (meters):</label>
        <input type="number" id="set-accuracy" value="30">

        <label title="Only log if you move at least this far.">Minimum Distance (meters):</label>
        <input type="number" id="set-distance" value="5">

        <label title="Force a log if this much time passes, even if standing still.">Stationary Time Log (seconds):</label>
        <input type="number" id="set-time" value="60">

        <label title="Ignore points that require moving faster than this.">Max Speed Sanity Check (km/h):</label>
		<input type="number" id="set-speed" value="100">
    </div>

    <div id="status">Status: Idle</div>
    <div id="accuracy"></div>
    
    <button id="startBtn">Start Tracking</button>
    <button id="stopBtn" disabled>Stop & Download</button>

    <script src="js/script.js" defer></script>
</body>
</html>
