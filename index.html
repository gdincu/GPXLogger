<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPX Logger</title>
	<link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
	<link rel="icon" type="image/png" href="icon-192.png">
</head>
<body>

	<div id="updateBanner" style="display: none; background: #28a745; color: white; padding: 12px; text-align: center; position: fixed; top: 0; left: 0; right: 0; z-index: 10000; box-shadow: 0 2px 5px rgba(0,0,0,0.3);">
		New version available! 
		<button id="updateBtn" style="margin-left: 15px; padding: 6px 12px; background: white; color: #28a745; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">
			Refresh App
		</button>
	</div>
    
    <div class="presets">
        <button id="btn-walk">🚶 Walk</button>
        <button id="btn-bike">🚴 Bike</button>
        <button id="btn-drive">🚗 Drive</button>
    </div>
    
    <details class="settings-card">
  <summary class="settings-header">
    <span>Settings</span>
    <span class="chevron">▼</span>
  </summary>

  <div class="settings-grid">
    <div class="setting-item">
      <label for="set-accuracy" title="Ignore points with an error margin larger than this.">Max Accuracy (m)</label>
      <input type="number" id="set-accuracy" value="30">
    </div>

    <div class="setting-item">
      <label for="set-distance" title="Only log if you move at least this far.">Min Distance (m)</label>
      <input type="number" id="set-distance" value="5">
    </div>

    <div class="setting-item">
      <label for="set-time" title="Force a log if this much time passes while moving, even if distance isn't met.">Max Time (s)</label>
      <input type="number" id="set-time" value="60">
    </div>

    <div class="setting-item">
      <label for="set-speed" title="Ignore points that require moving faster than this.">Max Speed (km/h)</label>
      <input type="number" id="set-speed" value="100">
    </div>
  </div>
</details>

    <div class="tracker-card">
  <div class="status-badge">
    <div id="status">Status: Idle</div>
    <div id="accuracy"></div>
  </div>

  <button id="lockGpsBtn" class="btn btn-secondary">Lock GPS Signal</button>

  <div class="controls">
    <button id="startBtn" class="btn btn-primary">Start Tracking</button>
    <button id="pauseBtn" class="btn btn-warning" disabled>Pause Tracking</button>
    <button id="stopBtn" class="btn btn-danger" disabled>Stop & Download</button>
  </div>
</div>

    <script src="js/script.js" defer></script>
	
	<button id="lockScreenBtn" style="
        position: fixed; 
        bottom: 20px; 
        left: 50%; 
        transform: translateX(-50%); 
        width: 90%; 
        max-width: 400px; 
        padding: 15px; 
        border: none; 
        border-radius: 8px; 
        font-weight: bold; 
        font-size: 16px; 
        cursor: pointer; 
        background-color: #ff9800; 
        color: white; 
        z-index: 1000; 
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
        Lock Screen
    </button>
	
	<div id="touchLockOverlay" class="touch-lock-overlay">
        <input type="range" id="unlockSlider" min="0" max="100" value="0" class="unlock-slider">
        <div style="font-size: 12px; color: #ccc;">Slide to unlock</div>
    </div>
</body>
</html>
